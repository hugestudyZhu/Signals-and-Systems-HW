name: Archive HW1 MATLAB source files

on:
  push:
    paths:
      - '.github/workflows/hw1-source-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-hw1-sources:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create and verify ZIP from the three original MATLAB Live Scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          folder = Path('HW1')
          names = ('1_4a.mlx', '1_4b.mlx', 'HW1_5abc.mlx')
          dest = folder / 'HW1_sources.zip'
          with zipfile.ZipFile(dest, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in names:
                  src = folder / name
                  if not src.is_file():
                      raise FileNotFoundError(src)
                  archive.write(src, arcname=name)
          with zipfile.ZipFile(dest) as archive:
              if archive.namelist() != list(names):
                  raise RuntimeError('Unexpected ZIP members')
              if archive.testzip() is not None:
                  raise RuntimeError('ZIP CRC check failed')
              for name in names:
                  original = (folder / name).read_bytes()
                  unpacked = archive.read(name)
                  if unpacked != original:
                      raise RuntimeError(f'Content mismatch for {name}')
                  print(f"VERIFIED {name}: {len(original)} bytes, sha256={hashlib.sha256(original).hexdigest()}")
          print(f"VERIFIED {dest}: {dest.stat().st_size} bytes, exactly {len(names)} source files")
          PY
      - name: Commit and push ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HW1/HW1_sources.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Add ZIP archive of Week 1 MATLAB sources'
            git push
          fi
